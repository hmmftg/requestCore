version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - inline
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: examples/
        linters:
          - gosec
      - path: libCrypto/ssm/des\.go
        linters:
          - gosec
        text: "G502|G405"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hmmftg/requestCore

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: true
