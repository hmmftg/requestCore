version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - gosec
    - misspell
    - revive
  # staticcheck and unused are disabled because honnef.co/go/tools@v0.7.0
  # (pinned by golangci-lint v2.12.2) panics on Go 1.27 AST changes
  # in the buildir pass (*ast.KeyValueExpr).
  # Re-enable once golangci-lint ships a version with honnef.co/go/tools
  # >= v0.8.0 with Go 1.27 support.
  disable:
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - inline
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: examples/
        linters:
          - gosec
      - path: libCrypto/ssm/des\.go
        linters:
          - gosec
        text: "G502|G405"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hmmftg/requestCore

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: true
