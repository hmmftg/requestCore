name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
      - name: Run golangci-lint
        run: golangci-lint run

  golangci-lint-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod
          cache: true
      # Force standalone module mode for v2 linting.
      - name: Force standalone v2 module
        run: |
          if [ -f go.work ]; then rm go.work; fi
          if [ -f go.work.sum ]; then rm go.work.sum; fi
      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
      - name: Run golangci-lint v2
        working-directory: v2
        run: golangci-lint run
