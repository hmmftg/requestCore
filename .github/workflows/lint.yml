name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          install-mode: source

  golangci-lint-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod
          cache: true
      # Force standalone module mode for v2 linting.
      - name: Force standalone v2 module
        run: |
          if [ -f go.work ]; then rm go.work; fi
          if [ -f go.work.sum ]; then rm go.work.sum; fi
      - name: golangci-lint v2
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: v2
          install-mode: source
