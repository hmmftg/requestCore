name: Release v2

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-release]')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod
          cache: true

      - name: Validate v2 module
        working-directory: v2
        run: |
          if ! grep -q "^module github.com/hmmftg/requestCore/v2$" go.mod; then
            echo "ERROR: v2/go.mod does not have correct module path"
            exit 1
          fi

      - name: Test v2
        working-directory: v2
        run: go test -race ./...

      - name: Vet v2
        working-directory: v2
        run: go vet ./...

      - name: Build v2
        working-directory: v2
        run: go build ./...

      - name: Get latest v2 tag
        id: get_tag
        run: |
          LATEST_TAG=$(git tag --list "v2/v*" --sort=-version:refname | head -1 || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v2/v2.0.0-alpha.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest v2 tag: $LATEST_TAG"

      - name: Determine version bump
        id: version_bump
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          COMMITS=$(git log --pretty=format:"%s" ${LATEST_TAG}..HEAD -- v2/ 2>/dev/null || echo "")

          echo "Commits since $LATEST_TAG (v2 only):"
          echo "$COMMITS"

          MAJOR_BUMP=false
          MINOR_BUMP=false
          PATCH_BUMP=false
          PRERELEASE_BUMP=false

          if echo "$COMMITS" | grep -qiE "(breaking|!|BREAKING)"; then
            MAJOR_BUMP=true
            echo "Major version bump detected (breaking changes)"
          elif echo "$COMMITS" | grep -qiE "^feat|^feature|^add"; then
            MINOR_BUMP=true
            echo "Minor version bump detected (new features)"
          elif echo "$COMMITS" | grep -qiE "^fix|^bug|^patch|^docs|^style|^refactor|^perf|^test|^chore"; then
            PATCH_BUMP=true
            echo "Patch version bump detected (fixes/improvements)"
          else
            PRERELEASE_BUMP=true
            echo "Prerelease bump (initial or other changes)"
          fi

          echo "major_bump=$MAJOR_BUMP" >> $GITHUB_OUTPUT
          echo "minor_bump=$MINOR_BUMP" >> $GITHUB_OUTPUT
          echo "patch_bump=$PATCH_BUMP" >> $GITHUB_OUTPUT
          echo "prerelease_bump=$PRERELEASE_BUMP" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"

          # Extract version from tag (format: v2/v2.x.y or v2/v2.x.y-prerelease.N)
          VERSION=${LATEST_TAG#v2/v}

          # Handle prerelease versions
          BASE_VERSION="${VERSION%%-*}"
          PRERELEASE=""
          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE="-${VERSION#*-}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [ "${{ steps.version_bump.outputs.major_bump }}" = "true" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "${{ steps.version_bump.outputs.minor_bump }}" = "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "${{ steps.version_bump.outputs.patch_bump }}" = "true" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v2/v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create and push tag
        if: steps.new_version.outputs.new_version != steps.get_tag.outputs.latest_tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"
          echo "Created and pushed tag: $NEW_VERSION"

      - name: Create Release
        if: steps.new_version.outputs.new_version != steps.get_tag.outputs.latest_tag
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.new_version.outputs.new_version }}
          release_name: Release ${{ steps.new_version.outputs.new_version }}
          draft: false
          prerelease: true
