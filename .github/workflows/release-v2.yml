name: Release v2

on:
  # Manual trigger only — prevents accidental automatic tagging.
  # The caller selects the bump type and whether it is a prerelease.
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - patch
          - minor
          - major
      prerelease_label:
        description: "Prerelease label (alpha, beta, rc) — used only when bump_type=prerelease"
        required: false
        type: string
        default: "alpha"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod
          cache: true

      # Force standalone module mode: remove go.work so v2 resolves
      # dependencies from its own go.mod, not the root workspace.
      - name: Force standalone v2 module
        run: |
          if [ -f go.work ]; then rm go.work; fi
          if [ -f go.work.sum ]; then rm go.work.sum; fi

      - name: Tidy v2
        working-directory: v2
        run: go mod tidy

      - name: Validate v2 module
        working-directory: v2
        run: |
          if ! grep -q "^module github.com/hmmftg/requestCore/v2$" go.mod; then
            echo "ERROR: v2/go.mod does not have correct module path"
            exit 1
          fi

      - name: Test v2
        working-directory: v2
        run: go test -race ./...

      - name: Vet v2
        working-directory: v2
        run: go vet ./...

      - name: Build v2
        working-directory: v2
        run: go build ./...

      - name: Get latest v2 tag
        id: get_tag
        run: |
          LATEST_TAG=$(git tag --list "v2/v*" --sort=-version:refname | head -1 || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v2/v2.0.0-alpha.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest v2 tag: $LATEST_TAG"

      - name: Calculate new version
        id: new_version
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          PRE_LABEL="${{ github.event.inputs.prerelease_label }}"

          # Extract version from tag (format: v2/v2.x.y or v2/v2.x.y-alpha.N)
          VERSION=${LATEST_TAG#v2/v}

          # Split base version and prerelease suffix
          BASE_VERSION="${VERSION%%-*}"
          EXISTING_PRE=""
          if [[ "$VERSION" == *"-"* ]]; then
            EXISTING_PRE="-${VERSION#*-}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          echo "Current: v${MAJOR}.${MINOR}.${PATCH}${EXISTING_PRE}"
          echo "Bump type: ${BUMP_TYPE}"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            IS_PRERELEASE=false
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            IS_PRERELEASE=false
          elif [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            IS_PRERELEASE=false
          elif [ "$BUMP_TYPE" = "prerelease" ]; then
            # Increment prerelease number or start a new prerelease series.
            # If the existing version has a prerelease suffix with the same
            # label, increment the number. Otherwise, bump the patch and
            # start at .0 with the new label.
            if [[ "$EXISTING_PRE" == "-${PRE_LABEL}."* ]]; then
              # Same label: increment the prerelease number
              PRE_NUM=$(echo "$EXISTING_PRE" | sed "s/-${PRE_LABEL}\.//")
              PRE_NUM=$((PRE_NUM + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}-${PRE_LABEL}.${PRE_NUM}"
            elif [[ "$EXISTING_PRE" == "-${PRE_LABEL}" ]]; then
              # Same label without number: start at .1
              NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}-${PRE_LABEL}.1"
            else
              # Different label or no existing prerelease: bump patch
              # and start new prerelease series at .0
              PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}-${PRE_LABEL}.0"
            fi
            IS_PRERELEASE=true
          else
            echo "ERROR: unknown bump type: $BUMP_TYPE"
            exit 1
          fi

          TAG="v2/${NEW_VERSION}"
          echo "new_tag=$TAG" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "New tag: $TAG"
          echo "Is prerelease: $IS_PRERELEASE"

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.new_version.outputs.new_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $TAG already exists"
            exit 1
          fi
          echo "Tag $TAG is available"

      - name: Generate release notes
        id: release_notes
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo ""
            echo "### Breaking Changes"
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- v2/ | grep -iE "^[a-z]+(\(.+\))?!:" || echo "_None_"
            echo ""
            echo "### Features"
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- v2/ | grep -iE "^feat" || echo "_None_"
            echo ""
            echo "### Bug Fixes"
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- v2/ | grep -iE "^fix" || echo "_None_"
            echo ""
            echo "### Documentation"
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- v2/ | grep -iE "^docs" || echo "_None_"
            echo ""
            echo "### Refactors"
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- v2/ | grep -iE "^refactor" || echo "_None_"
            echo ""
            echo "### Other"
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- v2/ | grep -viE "^(feat|fix|docs|refactor|style|chore|ci|merge|break)" || echo "_None_"
            echo ""
            echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${LATEST_TAG}...${{ steps.new_version.outputs.new_tag }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.new_version.outputs.new_tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_version.outputs.new_tag }}
          name: Release ${{ steps.new_version.outputs.new_tag }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ steps.new_version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## v2 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous tag:** ${{ steps.get_tag.outputs.latest_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New tag:** ${{ steps.new_version.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump type:** ${{ github.event.inputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease:** ${{ steps.new_version.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Draft:** ${{ github.event.inputs.draft }}" >> $GITHUB_STEP_SUMMARY
